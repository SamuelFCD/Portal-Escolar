{% extends "base.html" %}
{% block content %}
<h2>Tag</h2>

<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}

    <div class="mb-3">
        {{ form.titulo.label_tag }}
        {{ form.titulo }}
        {% if form.titulo.errors %}
        <div class="text-danger">{{ form.titulo.errors }}</div>
        {% endif %}
    </div>

    <div class="d-flex align-items-center gap-2">
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{% url 'noticias:listaTags' %}" class="btn btn-secondary" style="margin-bottom: 0;">Cancelar</a>
</div>
</form>
{% endblock content %}
