{% extends "base.html" %}
{% block content %}
<h2>Lista de Tags</h2>
<table class="tabela-listagem">
    <thead>
        <tr>
            <th>Título</th>
            <th>Detalhes</th>
        </tr>
    </thead>
    <tbody>
        {% for tag in tags %}
        <tr>
            <td><a href="{% url 'noticias:detalhesTags' tag.id %}">{{ tag.titulo }}</a></td>
            <td><a href="{% url 'noticias:detalhesTags' tag.id %}">Detalhes</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock content %}
