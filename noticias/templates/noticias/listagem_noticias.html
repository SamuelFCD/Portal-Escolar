{% extends "base.html" %}
{% block content %}
<h2>Lista de Notícias</h2>
<table class="tabela-listagem">
    <thead>
        <tr>
            <th>Título</th>
            <th>Categoria</th>
            <th>Detalhes</th>
        </tr>
    </thead>
    <tbody>
        {% for noticia in noticias %}
        <tr>
            <td><a href="{% url 'noticias:detalhesNoticias' noticia.id %}">{{ noticia.titulo }}</a></td>
            <td>{{ noticia.categoria.nome }}</td>
            <td><a href="{% url 'noticias:detalhesNoticias' noticia.id %}">Detalhes</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock content %}
